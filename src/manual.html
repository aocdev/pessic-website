<!doctype html>
<html lang="{{=lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{manual.title}}</title>
  <meta name="description" content="{{@manual.description}}">
  <meta name="theme-color" content="#1f5f55">
{{=alternates}}
  <link rel="icon" type="image/png" href="{{=root}}assets/favicon.png">
  <link rel="apple-touch-icon" href="{{=root}}assets/apple-touch-icon.png">
  <link rel="stylesheet" href="{{=root}}css/styles.css">
  <script src="{{=root}}js/main.js" defer></script>
</head>
<body>
  <!-- {{=generated}} -->
  <a class="skip-link" href="#contingut">{{a11y.skip}}</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="{{@a11y.home}}">
        <img src="{{=root}}assets/favicon.png" alt="" width="32" height="32">
        <span>Pessic</span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">
        <span class="sr-only">{{a11y.menu}}</span>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <nav id="menu" class="site-nav" aria-label="{{@a11y.mainNav}}">
        <a href="index.html#funcions">{{nav.features}}</a>
        <a href="index.html#com-comencar">{{nav.start}}</a>
        <a href="index.html#pantalles">{{nav.screens}}</a>
        <a href="index.html#preguntes">{{nav.faq}}</a>
        <a href="manual.html" aria-current="page">{{nav.manual}}</a>
{{=languages}}
        <a class="button button-small" href="index.html#descarrega">{{nav.download}}</a>
      </nav>
    </div>
  </header>

  <main id="contingut" class="manual">
    <div class="container manual-layout">
      <nav class="manual-toc" aria-label="{{@a11y.manualToc}}">
        <p>{{manual.toc}}</p>
        <ol>
{{=toc}}
        </ol>
      </nav>
      <article class="prose">
{{=body}}
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand" href="index.html">
        <img src="{{=root}}assets/favicon.png" alt="" width="28" height="28">
        <span>Pessic</span>
      </a>
      <p><em>{{footer.tagline}}</em></p>
      <nav aria-label="{{@a11y.footerNav}}">
        <a href="index.html">{{nav.home}}</a>
        <a href="index.html#preguntes">{{nav.faq}}</a>
        <a href="index.html#descarrega">{{nav.download}}</a>
      </nav>
      <p class="muted small">{{footer.manualCopyright}}</p>
    </div>
  </footer>
{{=jsStrings}}
</body>
</html>
